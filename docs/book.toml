[book]
title = "sghtmltopdf"
authors = ["waka"]
# The source language. The English edition is produced by applying po/en.po with `MDBOOK_BOOK__LANGUAGE=en mdbook build -d book/en`
language = "ja"
src = "src"

[build]
# Make `mdbook serve` rebuild when a po file is edited
extra-watch-dirs = ["po"]

[preprocessor.gettext]
# Apply the translations after links (the expansion of {{#include}} and the like)
after = ["links"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
# Convert after gettext has applied the translations, so diagram labels can be translated
after = ["gettext"]

[output.html]
git-repository-url = "https://github.com/waka/sghtmltopdf"
edit-url-template = "https://github.com/waka/sghtmltopdf/edit/main/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js", "theme/lang-switch.js"]
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1
