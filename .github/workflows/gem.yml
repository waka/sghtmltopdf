name: gem

# 毎PRで回すには重い(5プラットフォーム×複数Ruby ABI)ので、タグを打ったときと手動実行のときだけ動かす

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "publishせずにビルドと検証だけ行う"
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/gem.yml"]

jobs:
  cross-gem:
    name: build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-linux-musl # Alpine
          - aarch64-linux-musl # Alpine
          - arm64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # rb-sys-dockのコンテナへリポジトリルートごとマウントされるので、extクレートの`../../../../core`へのpath依存も解決できる
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          working-directory: bindings/ruby
          # 焼き込むRuby ABIを明示する。既定(`default`)はrb-sysのイメージが対応する
          # 全ABI(3.0から)になり、rake-compilerがその範囲でgemspecの
          # `required_ruby_version`を上書きするため、gemspecの`>= 3.2.0`より緩い
          # precompiled gemが出てしまう。ABI1つあたり9MB増える点でも絞る意味がある。
          ruby-versions: "3.2,3.3,3.4,4.0"
      - name: 同梱されたRuby ABIを表示する
        run: |
          gem=$(find bindings/ruby/pkg -name '*-${{ matrix.platform }}.gem')
          echo "### $(basename "$gem")" >> "$GITHUB_STEP_SUMMARY"
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV[0]).spec
            abis = spec.files.grep(%r{\Alib/sghtmltopdf/(\d+\.\d+)/}) { $1 }.uniq.sort
            puts "- platform: #{spec.platform}"
            puts "- ruby ABI: #{abis.empty? ? "(なし)" : abis.join(", ")}"
            puts "- required_ruby_version: #{spec.required_ruby_version}"
          ' "$gem" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: bindings/ruby/pkg/*-${{ matrix.platform }}.gem
          if-no-files-found: error

  # rubyプラットフォームのgem(ビルドを試みないplaceholder)
  # publishもこのジョブの成果物を使うので、出荷するものがそのまま検証される。
  source-gem:
    name: build ruby (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: "false"
          working-directory: bindings/ruby
      - name: ソースgemをbuildする
        working-directory: bindings/ruby
        run: bundle exec rake build
      - name: placeholderの条件を満たしているか確かめる
        run: |
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV[0]).spec
            abort "platformがrubyではない: #{spec.platform}" unless spec.platform.to_s == "ruby"
            # ここが空でないと、precompiled gemが無い環境でビルドが走って
            # `bundle install`ごと落ちる(gemspecのコメント参照)。
            abort "extensionsが空でない: #{spec.extensions.inspect}" unless spec.extensions.empty?
            bad = spec.files.grep(/\.rs\z|Cargo\.(toml|lock)\z|extconf\.rb\z/)
            abort "Rustのソースが混ざっている: #{bad.inspect}" unless bad.empty?
            abort "libが入っていない" unless spec.files.include?("lib/sghtmltopdf.rb")
            puts "ok: #{File.basename(ARGV[0])} / platform=#{spec.platform} / extensions=#{spec.extensions.inspect}"
          ' bindings/ruby/pkg/sghtmltopdf-*.gem
      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: bindings/ruby/pkg/sghtmltopdf-*.gem
          if-no-files-found: error

  # 利用側から見た振る舞いの確認
  #
  # 1. placeholder単体では、案内付きのLoadErrorで落ちる(黙って動かないのは避ける)
  # 2. `PLATFORMS`が`ruby`だけのGemfile.lockでも、ローカルのプラットフォーム向けの
  #    precompiled gemが入り、lockfileは書き換わらない
  smoke-ruby-platform:
    name: rubyプラットフォームのgemの扱い
    needs: [source-gem, cross-gem]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-ruby
          path: pkg
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: placeholderだけならビルドせずに入り、requireで案内が出る
        run: |
          set -eux
          # リポジトリのlibを見せないため、別のGEM_HOMEへ入れて別の場所で動かす
          export GEM_HOME="$RUNNER_TEMP/placeholder-home"
          export GEM_PATH="$GEM_HOME"
          gem install --no-document --ignore-dependencies pkg/sghtmltopdf-*.gem
          cd "$RUNNER_TEMP"
          if ruby -e 'require "sghtmltopdf"' 2>err.txt; then
            echo "::error::placeholderがrequireできてしまった(ネイティブ拡張が混ざっている)"
            exit 1
          fi
          cat err.txt
          grep -q "could not load its native extension" err.txt
          grep -q "pure-ruby placeholder" err.txt
      # placeholderとx86_64-linuxの両方をvendor/cacheへ置き、bundlerに選ばせる
      - uses: actions/download-artifact@v4
        with:
          name: gem-x86_64-linux
          path: pkg
      - name: PLATFORMSがrubyだけのGemfile.lockでもnative gemが入る
        run: |
          set -eux
          version=$(ruby -e 'require "./bindings/ruby/lib/sghtmltopdf/version"; print Sghtmltopdf::VERSION')
          app="$RUNNER_TEMP/app"
          mkdir -p "$app/vendor/cache"
          cp pkg/*.gem "$app/vendor/cache/"
          cd "$app"
          cat > Gemfile <<EOF
          source "https://rubygems.org"
          gem "sghtmltopdf", "$version"
          EOF
          cat > Gemfile.lock <<EOF
          GEM
            remote: https://rubygems.org/
            specs:
              sghtmltopdf ($version)

          PLATFORMS
            ruby

          DEPENDENCIES
            sghtmltopdf (= $version)
          EOF
          # --localなのでrubygems.orgへは出ない。vendor/cacheの中から選ばせる。
          BUNDLE_PATH=vendor/bundle bundle install --local
          # 入ったのがplaceholderではなくx86_64-linux向けであること
          # (`bundle list`はplatformを出さないので、読み込まれたspecを見る)
          platform=$(BUNDLE_PATH=vendor/bundle bundle exec ruby \
            -e 'require "sghtmltopdf"; print Gem.loaded_specs["sghtmltopdf"].platform')
          echo "installed platform: $platform"
          case "$platform" in
            x86_64-linux*) ;;
            *) echo "::error::placeholderか想定外のplatformが入った: $platform"; exit 1 ;;
          esac
          # lockfileは書き換わっていないこと(利用側はplatformを足さなくてよい)
          test "$(grep -c 'x86_64-linux' Gemfile.lock)" = "0"
          grep -qx "  ruby" Gemfile.lock
          # 実際に変換できること
          BUNDLE_PATH=vendor/bundle bundle exec ruby "$GITHUB_WORKSPACE/bindings/ruby/script/smoke.rb"

  # x86_64-linux: ランナー上でそのままインストール
  smoke-linux:
    needs: cross-gem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-x86_64-linux
          path: pkg
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: gem install して変換する
        run: |
          gem install --no-document ./pkg/*.gem
          ruby bindings/ruby/script/smoke.rb

  # aarch64-linux: QEMUでarm64のコンテナを動かす
  smoke-linux-arm64:
    needs: cross-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-aarch64-linux
          path: pkg
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: gem install して変換する(linux/arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work ruby:3.4-slim \
            bash -c '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends fonts-dejavu-core
              rm -rf /var/lib/apt/lists/*
              gem install --no-document ./pkg/*.gem
              ruby bindings/ruby/script/smoke.rb
            '

  # x86_64-linux-musl: Alpineのコンテナで確かめる
  # ローカルの.gemでも`gem install`はプラットフォーム一致を見るので、
  # Alpine側のRubyGemsがmusl向けgemを受け付けることの確認も兼ねる
  smoke-linux-musl:
    needs: cross-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-x86_64-linux-musl
          path: pkg
      - name: gem install して変換する(Alpine)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ruby:3.4-alpine \
            sh -c '
              set -eux
              apk add --no-cache font-dejavu
              gem install --no-document ./pkg/*.gem
              ruby bindings/ruby/script/smoke.rb
            '

  # aarch64-linux-musl: QEMUでarm64のAlpineコンテナを動かす
  smoke-linux-musl-arm64:
    needs: cross-gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-aarch64-linux-musl
          path: pkg
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: gem install して変換する(Alpine, linux/arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work ruby:3.4-alpine \
            sh -c '
              set -eux
              apk add --no-cache font-dejavu
              gem install --no-document ./pkg/*.gem
              ruby bindings/ruby/script/smoke.rb
            '

  # arm64-darwin: macOSランナーはApple Silicon
  smoke-macos-arm64:
    needs: cross-gem
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gem-arm64-darwin
          path: pkg
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: gem install して変換する
        run: |
          gem install --no-document ./pkg/*.gem
          ruby bindings/ruby/script/smoke.rb

  # rubygems.orgへのpublish
  # 認証はtrusted publishing(OIDC)で、APIキーはリポジトリに置かない
  publish:
    needs:
      - cross-gem
      - source-gem
      - smoke-ruby-platform
      - smoke-linux
      - smoke-linux-arm64
      - smoke-linux-musl
      - smoke-linux-musl-arm64
      - smoke-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # rubygems.orgのtrusted publisher設定でenvironmentを指定する
    environment: rubygems
    permissions:
      id-token: write # trusted publishing(OIDC)
      contents: write # GitHub Releaseの作成
    steps:
      - uses: actions/checkout@v4
        with:
          # release-gemはgit操作に自前のtokenを使う
          persist-credentials: false
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: "false"
          working-directory: bindings/ruby
      # クロスビルドした5プラットフォーム分と、rubyプラットフォームの
      # placeholder(`gem-ruby`)を`pkg/`へ集める。
      # ここでbuildし直さないので、smokeを通した成果物がそのままpublishされる。
      - uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          merge-multiple: true
          path: bindings/ruby/pkg
      - name: タグとgemのバージョンが一致することを確かめる
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(ruby -e 'require "./bindings/ruby/lib/sghtmltopdf/version"; print Sghtmltopdf::VERSION')
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::タグ($tag)とSghtmltopdf::VERSION($version)が一致しません" >&2
            exit 1
          fi
      - name: publishするgemの一覧
        run: |
          {
            echo "### publish対象"
            echo '```'
            ls -l bindings/ruby/pkg/*.gem
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Ruby公式のリリースアクション
      # trusted publishing(OIDC)の設定・sigstore attestations・rubygems.orgへの反映をやる
      - uses: rubygems/release-gem@v1
        if: github.event.inputs.dry_run != 'true'
        with:
          working-directory: bindings/ruby
      - name: GitHub Releaseを作る
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bindings/ruby/pkg/*.gem --generate-notes --verify-tag
