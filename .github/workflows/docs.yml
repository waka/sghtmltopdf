name: Docs

# Build the documentation site (docs/, mdbook) and publish it to GitHub Pages from main.
# The Japanese edition is served at `/` and the English one at `/en/`.
#
# Set Settings > Pages > Source to "GitHub Actions" in the repository settings first.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.0
  MDBOOK_I18N_HELPERS_VERSION: 0.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache mdbook toolchain
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: mdbook-${{ env.MDBOOK_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}-i18n-${{ env.MDBOOK_I18N_HELPERS_VERSION }}

      - uses: cargo-bins/cargo-binstall@main
        if: steps.cache-tools.outputs.cache-hit != 'true'

      - name: Install mdbook toolchain
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo binstall --no-confirm \
            mdbook@${MDBOOK_VERSION} \
            mdbook-mermaid@${MDBOOK_MERMAID_VERSION} \
            mdbook-i18n-helpers@${MDBOOK_I18N_HELPERS_VERSION}

      # Japanese (the source) first, then English. book/en sits under book/, so the reverse order would have the Japanese build wipe out the English one.
      - name: Build (ja)
        working-directory: docs
        run: mdbook build -d book

      - name: Build (en)
        working-directory: docs
        run: MDBOOK_BOOK__LANGUAGE=en mdbook build -d book/en

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
