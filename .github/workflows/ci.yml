name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # `svg-text`は既定オフ(rustybuzz・resvg等25クレートを引き込むため)。
      # 既定featureのテストだけではSVG内の`<text>`まわりが1つも走らないので、
      # このfeatureを足した組み合わせも回す(tests/svg_fonts.rsの大半はここ)。
      - name: cargo clippy (svg-text)
        run: cargo clippy -p sghtmltopdf-core --features svg-text --all-targets -- -D warnings
      - name: cargo test (svg-text)
        run: cargo test -p sghtmltopdf-core --features svg-text

  # 依存クレートのアドバイザリ照合(RustSec)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo install cargo-audit
        run: cargo install cargo-audit --locked
      # `--deny warnings`が無いと、unmaintained/yankedはexit 0で素通りする。
      # 判断済みのアドバイザリは`.cargo/audit.toml`にIDを明記して除外している。
      #
      # coreとRuby拡張はCargo.lockが別なので両方見る。`--file`でルートから
      # 指すことで、設定ファイル1つが両方に効く。
      - name: cargo audit (core)
        run: cargo audit --deny warnings
      - name: cargo audit (bindings/ruby)
        run: cargo audit --deny warnings --file bindings/ruby/Cargo.lock

  # Ruby gem(bindings/ruby)
  ruby:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      # rb-sysのビルドに要るRustとlibclangまで面倒を見てくれる
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # 既定(tarball)でビルド成果物をキャッシュする
          cargo-cache: default
          working-directory: bindings/ruby
      # CLIとgemの出力がバイト単位で一致することを見るspecと、実サーバとの結合specはrelease版のバイナリが要る
      # 無ければskipされるので、1つの組み合わせでだけビルドする
      - name: cargo build --release (CLI比較・実サーバ結合specのため)
        if: matrix.ruby == '4.0'
        run: cargo build --release --locked
      - name: rake (compile → spec)
        working-directory: bindings/ruby
        run: bundle exec rake

  # ベンチマーク(core/benches)。使い方はBENCHMARK.md。
  #
  # ベンチは`--disable-system-fonts`で走らせるので、ページ数・PDFサイズ・
  # 割り当て数といった決定的な指標は開発機(macOS aarch64)とrunner
  # (Linux x86_64)で一致する。commit済みの`baseline.json`をそのまま基準に
  # できるのはこのため。時間はrunnerのブレが大きい(共有マシンで数百%動く
  # ことがある)ので`--no-time`で判定から外す。ピークRSSはbaselineと
  # OS/アーキテクチャが違う場合は元々比較されない。
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ページ数やPDFサイズが動くのが意図した変更なら、BENCHMARK.mdの通り
      # `--save-baseline`で撮り直した`baseline.json`を同じPRに入れる。
      - name: metricsゲート
        run: |
          cargo bench -p sghtmltopdf-core --bench metrics -- --runs 1 --no-time
      # criterion側は数値を判定に使わない(runnerでは測れない)が、動かなく
      # なっていることには気付けるよう、各ベンチを1回ずつ流す。
      - name: criterionのbenchを1回ずつ流す
        run: |
          cargo bench -p sghtmltopdf-core \
            --bench phases --bench end_to_end --bench scale -- --test
