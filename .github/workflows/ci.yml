name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # `svg-text` is off by default (it pulls in rustybuzz, resvg and ~25 other crates).
      # Testing only the default features would never exercise `<text>` inside SVG,
      # so we also run a combination with that feature on (most of tests/svg_fonts.rs lives there).
      - name: cargo clippy (svg-text)
        run: cargo clippy -p sghtmltopdf --features svg-text --all-targets -- -D warnings
      - name: cargo test (svg-text)
        run: cargo test -p sghtmltopdf --features svg-text

  # The oldest toolchain the published crate claims to build with (`rust-version` in
  # core/Cargo.toml; keep the two in step). Only the lib and the bin count: the tests and
  # benches are not published, and their dev-dependencies may need a newer toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check -p sghtmltopdf --all-features --lib --bins --locked

  # Check dependency crates against advisories (RustSec)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo install cargo-audit
        run: cargo install cargo-audit --locked
      # Without `--deny warnings`, unmaintained/yanked advisories pass with exit 0.
      # Advisories we have already ruled on are excluded by ID in `.cargo/audit.toml`.
      #
      # core and the Ruby extension have separate Cargo.lock files, so we check both.
      # Pointing at them from the root with `--file` lets one config file cover both.
      - name: cargo audit (core)
        run: cargo audit --deny warnings
      - name: cargo audit (bindings/ruby)
        run: cargo audit --deny warnings --file bindings/ruby/Cargo.lock

  # Ruby gem(bindings/ruby)
  ruby:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      # Takes care of the Rust toolchain and libclang that rb-sys needs to build
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Cache the build artifacts with the default (tarball) strategy
          cargo-cache: default
          working-directory: bindings/ruby
      # The spec that checks the CLI and gem outputs match byte for byte, and the specs that talk to a real server, need a release binary.
      # They skip themselves when it is missing, so we only build it for one combination.
      - name: cargo build --release (for the CLI comparison and real-server integration specs)
        if: matrix.ruby == '4.0'
        run: cargo build --release --locked
      - name: rake (compile → spec)
        working-directory: bindings/ruby
        run: bundle exec rake

  # Benchmarks (core/benches). See BENCHMARK.md for usage.
  #
  # The benches run with `--disable-system-fonts`, so deterministic metrics
  # such as page count, PDF size, and allocation count match between the
  # development machine (macOS aarch64) and the runner (Linux x86_64). That is
  # why the committed `baseline.json` can be used as the reference as is.
  # Timing varies a lot on runners (it can swing by several hundred percent on
  # shared machines), so `--no-time` excludes it from the check. Peak RSS is
  # never compared when the OS/architecture differs from the baseline.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # If a change is meant to move the page count or PDF size, re-record
      # `baseline.json` with `--save-baseline` as described in BENCHMARK.md
      # and include it in the same PR.
      - name: metricsゲート
        run: |
          cargo bench -p sghtmltopdf --bench metrics -- --runs 1 --no-time
      # The criterion numbers are not used for the check (they cannot be
      # measured on a runner), but each bench runs once so that breakage is
      # still noticed.
      - name: criterionのbenchを1回ずつ流す
        run: |
          cargo bench -p sghtmltopdf \
            --bench phases --bench end_to_end --bench scale -- --test
